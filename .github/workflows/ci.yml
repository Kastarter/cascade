name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The package declares swift-tools-version 6.0; the macos-14 runner defaults
      # to Xcode 15 (Swift 5.10), which can't even parse the manifest. Select the
      # newest installed Xcode (16.x → Swift 6) so `swift test` runs.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
