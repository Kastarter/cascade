name: release-macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cascade.app
          path: .build/Cascade.app
          if-no-files-found: error
