name: release-macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Match the package's swift-tools-version 6.0 (runner default is Xcode 15 /
      # Swift 5.10, which can't build the manifest).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cascade.app
          path: .build/Cascade.app
          if-no-files-found: error
